<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>De Barrio · Servicios para comercios de cercanía</title>
  <meta name="description" content="Planilla de precios con tus costos, el fiado pasado en limpio, carteles con el precio por kilo. Para ferreterías, almacenes y comercios de barrio. Se paga una vez.">
  <meta property="og:title" content="De Barrio">
  <meta property="og:description" content="Servicios para comercios de cercanía.">
  <meta property="og:image" content="/compartir.png">
  <meta name="theme-color" content="#23160F">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fuentes/yeseva-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <a class="saltar" href="#lista">Ir a la lista</a>

  <header class="letrero">
    <div class="ancho">
      <div class="panel">
        <svg class="panel-dibujo" viewBox="0 0 1180 600" aria-hidden="true" focusable="false"><use href="/filete.svg#letrero"/></svg>
        <div class="panel-texto">
          <h1>De Barrio</h1>
          <p class="rubro">Servicios para comercios de cercanía</p>
        </div>
      </div>
    </div>
  </header>

  <main class="ancho mostrador">
    <section id="lista" aria-labelledby="t-lista">
      <div class="boleta-cabeza">
        <h2 id="t-lista">¿Qué va a llevar?</h2>
        <p class="boleta-numero"><small>N°</small>0001-00000001</p>
      </div>
      <svg class="llave" viewBox="0 0 600 60" aria-hidden="true" focusable="false"><use href="/filete.svg#llave"/></svg>
      <p class="aclaracion">Tocá lo que te sirva. El precio final depende de lo que marques.</p>
      <p class="boleta-columnas" aria-hidden="true"><span>Detalle</span><span>Precio</span></p>
      <div id="catalogo"></div>
    </section>

    <section id="confirmado" class="confirmado" hidden aria-live="polite"></section>

    <section id="formulario" hidden aria-labelledby="f-titulo">
      <button type="button" class="volver" id="volver">Volver</button>
      <h2 id="f-titulo"></h2>
      <p class="f-precio" id="f-precio"></p>
      <p id="f-descripcion"></p>

      <form id="pedido" novalidate>
        <fieldset>
          <legend>Tu pedido</legend>
          <label id="f-adjuntos" class="fotos" hidden><span class="fotos-titulo">Fotos</span> <span id="f-adjuntos-ayuda"></span>
            <input type="file" name="adjuntos" accept="image/*,application/pdf" multiple>
          </label>
          <div id="f-campos"></div>
        </fieldset>

        <fieldset>
          <legend>Tu negocio</legend>
          <label>Nombre del negocio <input name="negocio.nombre" required autocomplete="organization"></label>
          <label>Tu email <input type="email" name="contacto.email" required autocomplete="email" inputmode="email" placeholder="Ahí te llegan la confirmación y el pedido"></label>
          <label>Tu WhatsApp <em>(si querés)</em> <input type="tel" name="contacto.telefono" autocomplete="tel" inputmode="tel" placeholder="Ej.: 11 5555 5555"></label>
        </fieldset>

      </form>
      <p class="error error-pedido" id="error" role="alert" hidden></p>
      <div class="barra-total" id="barra-total"><span>Total</span> <strong id="barra-total-monto"></strong>
        <span class="garantia-nota">Primero te mandamos una muestra. Pagás solo si te gusta.</span>
        <button type="submit" form="pedido" class="barra-comprar" id="pagar">Confirmar pedido</button></div>
    </section>

  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
