# Despliegue del sitio completo (con servidor: mails, muestras y cobro con Mercado Pago) en Render.
# En Render: New > Blueprint > elegir este repositorio. Después cargar las variables marcadas sync: false.
services:
  - type: web
    name: de-barrio
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MP_ACCESS_TOKEN        # token de PRUEBA de Mercado Pago (empieza con TEST-) para probar
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_URL             # la URL que te da Render, por ejemplo https://de-barrio.onrender.com
        sync: false
      - key: ANTHROPIC_API_KEY      # sin esto, usar GENERADOR=demo
        sync: false
      - key: GENERADOR
        value: demo
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SMTP_URL               # smtps://usuario:clave@smtp.proveedor.com:465 de la casilla de De Barrio
        sync: false
      - key: CORREO_DESDE           # "De Barrio <pedidos@...>"
        sync: false
      - key: CORREO_CASILLA         # donde te llegan los pedidos
        sync: false
      - key: REVISAR_ANTES          # 1: Claude arranca cuando confirmás desde el mail; 0: arranca solo al pagar
        value: "1"
